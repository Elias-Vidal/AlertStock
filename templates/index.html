<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertas de Tickers</title>
    <!-- Fonte Inter para visual de Dashboard Financeiro -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="app-header">
            <h1>Painel de Alertas</h1>
            <p class="subtitle">Monitore seus ativos em tempo real</p>
        </div>
        
        <!-- Transformado em <form> para permitir o uso da tecla "Enter" no teclado -->
        <form class="form-group" id="tickerForm" onsubmit="event.preventDefault(); addTicker();">
            <input type="text" id="tickerInput" placeholder="Ex: MSFT, AXP, BTC-USD" autocomplete="off" required>
            
            <select id="conditionSelect" required>
                <option value="maior">Maior que (>)</option>
                <option value="menor">Menor que (<)</option>
            </select>
            
            <input type="number" id="targetPrice" placeholder="Valor Alvo (USD)" step="0.01" required>
            
            <!-- ID adicionado conforme a exigência do novo JavaScript -->
            <button type="submit" id="addTickerButton">Adicionar Alerta</button>
        </form>

        <div id="tickersList" class="tickers-grid"></div>
    </div>

    <audio id="alertSound" src="{{ url_for('static', filename='alerta.mp3') }}" preload="auto"></audio>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
